# Cloud Build pipeline: build the container, push to Artifact Registry,
# deploy to Cloud Run.
#
# One-time setup in your GCP project:
#   1. Create an Artifact Registry docker repo:
#        gcloud artifacts repositories create ${_REPOSITORY} \
#          --repository-format=docker --location=${_REGION}
#   2. Store the Firebase web config in Secret Manager (values from the
#      Firebase console → Project settings → Your apps):
#        for s in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
#                 VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
#                 VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
#                 VITE_ADMIN_EMAIL; do
#          printf 'VALUE' | gcloud secrets create "$s" --data-file=-
#        done
#   3. Grant the Cloud Build service account the roles:
#        Secret Manager Secret Accessor, Cloud Run Admin,
#        Artifact Registry Writer, Service Account User
#   4. Create a Cloud Build trigger on pushes to main pointing at this file.
#
# Firestore security rules are deployed separately (they are not part of the
# container). After changing firestore.rules run:
#   npx firebase-tools deploy --only firestore:rules --project <PROJECT_ID>

substitutions:
  _REGION: us-central1
  _REPOSITORY: elite-mechanic
  _SERVICE: elite-mechanic-consultations
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_PROJECT_ID/versions/latest
      env: VITE_FIREBASE_PROJECT_ID
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID
    - versionName: projects/${PROJECT_ID}/secrets/VITE_ADMIN_EMAIL/versions/latest
      env: VITE_ADMIN_EMAIL

steps:
  # Build the image, baking the (public) Firebase web config into the bundle
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_PROJECT_ID
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID
      - VITE_ADMIN_EMAIL
    args:
      - -c
      - |
        docker build \
          --build-arg VITE_FIREBASE_API_KEY="$$VITE_FIREBASE_API_KEY" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="$$VITE_FIREBASE_AUTH_DOMAIN" \
          --build-arg VITE_FIREBASE_PROJECT_ID="$$VITE_FIREBASE_PROJECT_ID" \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET="$$VITE_FIREBASE_STORAGE_BUCKET" \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$$VITE_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg VITE_FIREBASE_APP_ID="$$VITE_FIREBASE_APP_ID" \
          --build-arg VITE_ADMIN_EMAIL="$$VITE_ADMIN_EMAIL" \
          -t "${_IMAGE}:${SHORT_SHA}" \
          -t "${_IMAGE}:latest" \
          .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
